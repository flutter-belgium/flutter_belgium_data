name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Install dependencies
        run: dart pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: dart analyze --fatal-infos

      - name: Install lcov
        run: sudo apt-get install -y lcov

      - name: Run tests with coverage
        run: dart test --coverage=coverage

      - name: Format coverage report
        run: dart run coverage:format_coverage --lcov --in=coverage --out=coverage/lcov.info --report-on=lib

      - name: Check 100% coverage
        run: |
          COVERAGE=$(lcov --summary coverage/lcov.info 2>&1 | grep "lines" | grep -oP '\d+\.\d+%' | head -1)
          echo "Line coverage: $COVERAGE"
          [ "$COVERAGE" = "100.0%" ] || { echo "Coverage is not 100%: $COVERAGE"; exit 1; }
